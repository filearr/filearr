name: build

# Release publishing. The multi-arch push to ghcr.io is GATED on the full CI
# suite: the `ci` job below calls .github/workflows/ci.yml (backend, frontend,
# agent, alembic drift, image validation) at this same commit, and `image`
# refuses to run until it passes. Before 2026-07-20 the push had no gate at
# all — and on v* tags no CI even ran, since ci.yml only triggered on PRs and
# main. This workflow is now the ONLY thing that runs CI on main/tag pushes;
# ci.yml itself keeps just the pull_request trigger to avoid double runs.
#
# Action pins: full commit SHAs with the semver in a trailing comment — see
# the header of ci.yml for the rationale; .github/dependabot.yml keeps them
# current.

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Manual re-trigger for the whole gate+publish pipeline. Exists because
  # GitHub occasionally DROPS a push event entirely (live 2026-08-07: a main
  # push produced zero workflow runs, so that commit was never validated or
  # published) — this is the recovery lever, no empty commit needed.
  workflow_dispatch:

# Queue rather than cancel: interrupting an in-flight publish mid-push could
# leave a moved tag half-updated on ghcr.io. Superseded runs wait their turn.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    # Runs the entire CI workflow (all five jobs) at this commit. Job-level
    # permissions here cap what the called workflow's GITHUB_TOKEN can do.
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Sigstore keyless build provenance (SLSA): the workflow's OIDC identity
      # signs an attestation binding the pushed image digest to this repo,
      # workflow, and commit — publicly logged (Rekor), no key custody.
      # Verify: gh attestation verify oci://ghcr.io/pwsh/filearr:latest -R pwsh/filearr
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` only auto-applies on SEMVER tag pushes by default; our
          # releases are branch pushes to main, which previously produced ONLY
          # a `:main` tag — while the Unraid templates and docs say `:latest`.
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      # Canonical agent version: agent/VERSION is the single source of truth
      # (also read by build_windows_agent.ps1 and the Proxmox deploy). The old
      # ref_name stamp made every main-branch build report "main-<sha>" — not
      # orderable, and disagreeing with every other build path.
      - id: agentver
        run: echo "version=$(tr -d ' \r\n' < agent/VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamps the agentdist stage's cross-compiled first-install binaries
          # (served by /api/v1/agent-dist) — same VERSION scheme as agent-image.
          build-args: |
            VERSION=${{ steps.agentver.outputs.version }}@${{ github.sha }}
          # The ci call's validation build just wrote amd64 layers to the GHA
          # cache at this same ref — reuse them so gating doesn't double the
          # wall time; mode=max also caches arm64 for the next release.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # No inline buildx attestations. build-push-action turns provenance
          # on by default when pushing, which publishes the tag as a 4-entry
          # index: amd64, arm64, and TWO `unknown/unknown` attestation
          # manifests. Container update-checkers walk that index looking for an
          # entry matching the host architecture, and the unknown/unknown rows
          # break the match — Unraid reported a permanent "update available" on
          # 2026-08-11 against an image whose revision label was already the
          # running commit. Nothing is lost: build provenance still ships, via
          # actions/attest-build-provenance below, which is the STRONGER of the
          # two (Sigstore keyless, publicly logged in Rekor) and attaches as an
          # OCI referrer rather than as an entry in the tag's index.
          provenance: false
          sbom: false
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Standalone inventory-agent container (agent/Dockerfile): the pure-Go agent
  # + enrollment/rescan entrypoint, published as <repo>-agent for the Unraid
  # CA template (unraid/filearr-agent.xml) and any other container host. Same
  # CI gate as the main image. No release-signing key is pinned into the build
  # (self-update stays fail-closed) — container hosts update by pulling the
  # new image, which is exactly what this job publishes.
  agent-image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Same Sigstore keyless provenance as the main image job.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-agent
          # Same `latest` fix as the main image job above.
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      # Same canonical agent/VERSION stamp as the main image job above.
      - id: agentver
        run: echo "version=$(tr -d ' \r\n' < agent/VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: push
        with:
          context: ./agent
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.agentver.outputs.version }}@${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Separate cache scope: the default scope belongs to the main image
          # build and the two would evict each other's layers.
          cache-from: type=gha,scope=agent-image
          cache-to: type=gha,mode=max,scope=agent-image
          # No inline buildx attestations. build-push-action turns provenance
          # on by default when pushing, which publishes the tag as a 4-entry
          # index: amd64, arm64, and TWO `unknown/unknown` attestation
          # manifests. Container update-checkers walk that index looking for an
          # entry matching the host architecture, and the unknown/unknown rows
          # break the match — Unraid reported a permanent "update available" on
          # 2026-08-11 against an image whose revision label was already the
          # running commit. Nothing is lost: build provenance still ships, via
          # actions/attest-build-provenance below, which is the STRONGER of the
          # two (Sigstore keyless, publicly logged in Rekor) and attaches as an
          # OCI referrer rather than as an entry in the tag's index.
          provenance: false
          sbom: false
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository }}-agent
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # UR-T1 (2026-08-12): the TLS reverse proxy (docker/caddy/Dockerfile — xcaddy
  # with caddy-dns/cloudflare + mholt/caddy-l4), published as <repo>-caddy for
  # the Unraid CA template (unraid/filearr-caddy.xml).
  #
  # Why publish a proxy image at all: FILEARR_AGENT_AUTH_MODE=mtls-header needs a
  # proxy that (a) terminates client certs against the step-ca root and (b) passes
  # the ca.<domain> handshake through RAW at layer 4. The stock caddy image has
  # NEITHER plugin, so an Unraid operator previously had no way to reach mTLS
  # parity without running the compose stack — the gap this closes.
  #
  # docker-compose.yml deliberately keeps BUILDING this locally rather than
  # pulling the published tag: the local build is the source of truth for the
  # Proxmox path, and compose bind-mounts ./docker/caddy over /etc/caddy anyway.
  #
  # Everything else mirrors agent-image exactly (same `needs: ci` gate, same
  # metadata tags, same provenance:false/sbom:false rationale from 77a4c5f, same
  # Sigstore attestation) — with its OWN cache scope, because the GHA cache
  # scopes are per-image and sharing one makes the jobs evict each other.
  caddy-image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Same Sigstore keyless provenance as the main and agent image jobs.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-caddy
          # Same `latest` fix as the main image job above.
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: push
        with:
          # Repo root, matching docker-compose.yml's caddy service: the Dockerfile
          # COPYs docker/caddy/Caddyfile.* and docker/caddy/entrypoint.sh, which
          # are outside a ./docker/caddy context.
          context: .
          file: docker/caddy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Own cache scope — see the job comment above.
          cache-from: type=gha,scope=caddy-image
          cache-to: type=gha,mode=max,scope=caddy-image
          # No inline buildx attestations. build-push-action turns provenance
          # on by default when pushing, which publishes the tag as a 4-entry
          # index: amd64, arm64, and TWO `unknown/unknown` attestation
          # manifests. Container update-checkers walk that index looking for an
          # entry matching the host architecture, and the unknown/unknown rows
          # break the match — Unraid reported a permanent "update available" on
          # 2026-08-11 against an image whose revision label was already the
          # running commit. Nothing is lost: build provenance still ships, via
          # actions/attest-build-provenance below, which is the STRONGER of the
          # two (Sigstore keyless, publicly logged in Rekor) and attaches as an
          # OCI referrer rather than as an entry in the tag's index.
          provenance: false
          sbom: false
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository }}-caddy
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
